name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write 
  
jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    
    runs-on: ubuntu-latest
    container: debian:12
    
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y curl build-essential gcc git pkg-config libssl-dev ca-certificates
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      shell: bash
    
    - name: Setup Rust environment
      run: |
        . $HOME/.cargo/env
        rustup default stable
      shell: bash

    - name: Install cargo-deb
      run: |
        . $HOME/.cargo/env
        cargo install cargo-deb
      shell: bash

    - name: Add Rust target
      run: |
        . $HOME/.cargo/env
        rustup target add ${{ matrix.target }}
      shell: bash

    - name: Install cross-compilation tools (ARM64)
      if: matrix.arch == 'arm64'
      run: |
        apt-get install -y gcc-aarch64-linux-gnu

    - name: Configure Cargo for cross-compilation (ARM64)
      if: matrix.arch == 'arm64'
      run: |
        mkdir -p .cargo
        cat > .cargo/config.toml << EOF
        [target.aarch64-unknown-linux-gnu]
        linker = "aarch64-linux-gnu-gcc"
        EOF

    - name: Build release binary
      run: |
        . $HOME/.cargo/env
        cargo build --release --target ${{ matrix.target }}
      shell: bash

    - name: Build .deb package
      run: |
        . $HOME/.cargo/env
        cargo deb --target ${{ matrix.target }} --no-build
      shell: bash

    - name: Get package info
      id: package
      run: |
        DEB_FILE=$(ls target/${{ matrix.target }}/debian/*.deb | head -n 1)
        echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
        echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Architecture: ${{ matrix.arch }}"
        echo "Version: $VERSION"
        echo "Package: $DEB_FILE"

    - name: Upload .deb as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{ matrix.arch }}
        path: ${{ steps.package.outputs.deb_file }}

    - name: Upload .deb to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.package.outputs.version }}
        name: Release v${{ steps.package.outputs.version }}
        files: ${{ steps.package.outputs.deb_file }}
        generate_release_notes: true
        draft: true
        prerelease: false
