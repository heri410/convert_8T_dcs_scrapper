name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write 
  
jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deb
      run: cargo install cargo-deb

    - name: Add Rust target
      run: rustup target add ${{ matrix.target }}

    - name: Install cross-compilation tools (ARM64)
      if: matrix.arch == 'arm64'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Configure Cargo for cross-compilation (ARM64)
      if: matrix.arch == 'arm64'
      run: |
        mkdir -p .cargo
        cat > .cargo/config.toml << EOF
        [target.aarch64-unknown-linux-gnu]
        linker = "aarch64-linux-gnu-gcc"
        EOF

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build .deb package
      run: cargo deb --target ${{ matrix.target }} --no-build

    - name: Get package info
      id: package
      run: |
        DEB_FILE=$(ls target/${{ matrix.target }}/debian/*.deb | head -n 1)
        echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
        echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Architecture: ${{ matrix.arch }}"
        echo "Version: $VERSION"
        echo "Package: $DEB_FILE"

    - name: Upload .deb as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{ matrix.arch }}
        path: ${{ steps.package.outputs.deb_file }}

    - name: Upload .deb to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.package.outputs.version }}
        name: Release v${{ steps.package.outputs.version }}
        files: ${{ steps.package.outputs.deb_file }}
        generate_release_notes: true
        draft: true
        prerelease: false
